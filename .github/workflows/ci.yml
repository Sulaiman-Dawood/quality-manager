# Tests and builds on every push and pull request; on a published release,
# also checks the version and attaches both zips to the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node test/run-tests.js

      - name: Build Chrome/Edge and Firefox zips
        run: node tools/build.mjs

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: quality-manager-zips
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi

      - name: Build
        run: node tools/build.mjs

      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
